name: LVX (formerly LetsVenture)
description: 'LVX — formerly LetsVenture — is an India-based private market investing
  platform founded in 2013 by Shanti Mohan and headquartered in Bengaluru, with teams
  in Delhi and Mumbai. The platform connects startup founders raising capital with
  angel investors, family offices and VCs, and has been a SEBI-regulated entity since
  its Angel AIF was approved in 2018. Its product surface spans LVX start (early-stage
  angel investing), LVX grow (growth-stage and co-investment deals), LVXschool (private
  market investor education), LVX Debt (non-dilutive debt financing for startups)
  and LVX Track (portfolio dashboards), alongside the sister platform trica. The company
  publicly reports 35K+ startups, 14K+ investors and over Rs 1500 Cr of AIF assets
  under management. LVX rebranded from LetsVenture in July 2025 and letsventure.com
  now redirects to lvxventures.com. LVX operates no public developer API program: no
  developer portal, API reference, OpenAPI definition or SDKs were found, and the
  platform-backing API at api.lvxventures.com is a private token-authenticated service.'
